name: Bot regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock.txt
      - name: Install tested dependency versions
        run: python -m pip install -r requirements.lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run every suite with external networking blocked by testing_env
        run: python run_tests.py
